<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>教室大屏 · 接收端</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563eb' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='m3 11 18-5v12L3 14v-3z'/%3E%3Cpath d='M11.6 16.8a3 3 0 1 1-5.8-1.6'/%3E%3C/svg%3E" />
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  .svg-icon{width:1em;height:1em;display:inline-block;vertical-align:-0.125em;}
  html,body{width:100%;height:100%;overflow:hidden;}
  body{
    font-family:'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif;
    background:radial-gradient(ellipse at 50% 0%,#1e293b 0%,#0f172a 55%,#020617 100%);
    color:#e2e8f0;
    display:flex;align-items:center;justify-content:center;
    user-select:none;-webkit-user-select:none;
  }
  .bg-grid{
    position:fixed;inset:0;pointer-events:none;
    background-image:
      linear-gradient(rgba(56,189,248,.05) 1px,transparent 1px),
      linear-gradient(90deg,rgba(56,189,248,.05) 1px,transparent 1px);
    background-size:52px 52px;
  }
  .hud{
    position:fixed;top:0;left:0;right:0;z-index:10;
    display:flex;justify-content:space-between;align-items:center;
    padding:22px 40px;
    font-size:14px;color:#64748b;letter-spacing:1px;
  }
  .hud .room{
    color:#38bdf8;font-weight:700;font-size:20px;letter-spacing:2px;
    display:flex;align-items:center;gap:10px;
  }
  .hud .room::before{
    content:'';width:10px;height:10px;border-radius:2px;background:#38bdf8;
    box-shadow:0 0 12px #38bdf8;
  }
  .hud-right{display:flex;align-items:center;gap:26px;}
  .hud .status{display:flex;align-items:center;gap:8px;font-size:13px;}
  .dot{
    width:10px;height:10px;border-radius:50%;
    background:#ef4444;box-shadow:0 0 10px #ef4444;
    transition:background .3s,box-shadow .3s;
  }
  .dot.on{background:#22c55e;box-shadow:0 0 12px #22c55e;}
  .clock{
    font-size:19px;font-weight:700;color:#94a3b8;
    letter-spacing:2px;font-variant-numeric:tabular-nums;
  }
  .idle{text-align:center;padding:40px;}
  .idle .icon{font-size:96px;margin-bottom:26px;opacity:.3;animation:breathe 4s ease-in-out infinite;}
  @keyframes breathe{0%,100%{opacity:.22;transform:scale(1);}50%{opacity:.4;transform:scale(1.06);}}
  .idle h1{font-size:34px;font-weight:200;color:#475569;letter-spacing:16px;margin-bottom:16px;}
  .idle p{font-size:15px;color:#334155;letter-spacing:3px;}
  #popup{
    position:fixed;inset:0;z-index:100;
    display:none;align-items:center;justify-content:center;padding:70px;
    background:rgba(2,6,23,.78);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  }
  #popup.show{display:flex;animation:fadeIn .22s ease;}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .msg-card{
    max-width:1200px;width:100%;
    background:linear-gradient(160deg,#1e293b 0%,#0f172a 100%);
    border-radius:30px;
    padding:52px 64px 44px;
    box-shadow:
      0 0 0 2px rgba(56,189,248,.22),
      0 0 90px rgba(56,189,248,.10),
      0 40px 110px rgba(0,0,0,.65);
    animation:popIn .32s cubic-bezier(.2,1.2,.4,1);
  }
  @keyframes popIn{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
  .msg-card.notice{box-shadow:0 0 0 2px rgba(250,204,21,.30),0 0 90px rgba(250,204,21,.10),0 40px 110px rgba(0,0,0,.65);}
  .msg-card.urgent{box-shadow:0 0 0 3px rgba(239,68,68,.45),0 0 110px rgba(239,68,68,.18),0 40px 110px rgba(0,0,0,.7);animation:popIn .32s cubic-bezier(.2,1.2,.4,1),shake .5s ease 1;}
  .msg-card.image{box-shadow:0 0 0 2px rgba(129,140,248,.35),0 0 90px rgba(129,140,248,.15),0 40px 110px rgba(0,0,0,.65);}
  .msg-card.video{box-shadow:0 0 0 2px rgba(34,197,94,.30),0 0 90px rgba(34,197,94,.10),0 40px 110px rgba(0,0,0,.65);}
  .msg-card.file{box-shadow:0 0 0 2px rgba(129,140,248,.35),0 0 90px rgba(129,140,248,.15),0 40px 110px rgba(0,0,0,.65);}
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-8px);}
    40%{transform:translateX(8px);}
    60%{transform:translateX(-5px);}
    80%{transform:translateX(5px);}
  }
  .msg-head{
    display:flex;align-items:center;gap:16px;margin-bottom:26px;
    padding-bottom:20px;border-bottom:1px solid rgba(148,163,184,.14);
  }
  .msg-type{
    font-size:15px;font-weight:700;letter-spacing:2px;
    padding:6px 16px;border-radius:999px;
    background:rgba(56,189,248,.14);color:#7dd3fc;
    flex-shrink:0;
  }
  .msg-card.notice .msg-type{background:rgba(250,204,21,.14);color:#fde047;}
  .msg-card.urgent .msg-type{background:rgba(239,68,68,.18);color:#fca5a5;}
  .msg-card.image .msg-type{background:rgba(129,140,248,.18);color:#c7d2fe;}
  .msg-card.video .msg-type{background:rgba(34,197,94,.14);color:#86efac;}
  .msg-card.file .msg-type{background:rgba(129,140,248,.18);color:#c7d2fe;}
  .msg-from{
    font-size:16px;color:#94a3b8;letter-spacing:1px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .msg-content{
    font-size:44px;line-height:1.55;font-weight:600;
    color:#f1f5f9;letter-spacing:2px;
    word-break:break-word;
    white-space:pre-wrap;
    text-shadow:0 2px 18px rgba(56,189,248,.12);
  }
  .msg-card.notice .msg-content{color:#fef9c3;}
  .msg-card.urgent .msg-content{color:#fee2e2;text-shadow:0 2px 18px rgba(239,68,68,.25);}
  .msg-voice-tag{
    display:inline-block;
    font-size:13px;
    font-weight:600;
    color:#4dd0b1;
    background:rgba(22,160,133,.15);
    padding:2px 10px;
    border-radius:999px;
    margin-left:10px;
    letter-spacing:1px;
    vertical-align:middle;
  }
  .msg-image{
    display:flex;
    justify-content:center;
    align-items:center;
    max-height:62vh;
    overflow:hidden;
  }
  .msg-image img{
    max-width:100%;
    max-height:62vh;
    object-fit:contain;
    border-radius:14px;
    box-shadow:0 12px 40px rgba(0,0,0,.5);
    background:#0b1220;
  }
  .msg-image video{
    max-width:100%;
    max-height:62vh;
    border-radius:14px;
    background:#0b1220;
    box-shadow:0 12px 40px rgba(0,0,0,.5);
    display:block;
  }
  .msg-file{
    display:flex;flex-direction:column;align-items:center;gap:12px;
    padding:30px 20px;
    background:rgba(148,163,184,.06);
    border:1px dashed rgba(148,163,184,.25);
    border-radius:16px;
  }
  .msg-file-icon{font-size:84px;opacity:.75;line-height:1;}
  .msg-file-name{
    font-size:26px;font-weight:600;color:#e2e8f0;
    letter-spacing:1px;word-break:break-all;text-align:center;max-width:100%;
  }
  .msg-file-hint{font-size:14px;color:#94a3b8;letter-spacing:2px;}
  .msg-file-btn{
    display:inline-block;margin-top:6px;padding:12px 32px;border-radius:12px;
    background:linear-gradient(135deg,#2f6df6 0%,#1e5ae0 100%);
    color:#fff;font-size:16px;font-weight:700;letter-spacing:2px;
    text-decoration:none;box-shadow:0 8px 24px rgba(47,109,246,.35);
    transition:transform .15s,box-shadow .15s;
  }
  .msg-file-btn:hover{transform:translateY(-1px);box-shadow:0 12px 28px rgba(47,109,246,.45);}
  .msg-foot{
    margin-top:30px;text-align:right;
    font-size:13px;color:#475569;letter-spacing:2px;
  }
  .msg-countdown{
    margin-top:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:4px;
    width:100%;
    font-size:14px;
    color:#64748b;
    letter-spacing:2px;
    font-variant-numeric:tabular-nums;
    user-select:none;
  }
  .msg-countdown .cd-num{
    display:inline-block;
    min-width:2ch;
    color:#38bdf8;
    font-weight:700;
    font-size:18px;
    margin:0 4px;
    text-shadow:0 0 12px rgba(56,189,248,.35);
  }
  .msg-card.notice .msg-countdown .cd-num{color:#facc15;text-shadow:0 0 12px rgba(250,204,21,.35);}
  .msg-card.urgent .msg-countdown .cd-num{color:#f87171;text-shadow:0 0 12px rgba(248,113,113,.35);}
  .msg-card.image .msg-countdown .cd-num{color:#a5b4fc;text-shadow:0 0 12px rgba(129,140,248,.35);}
  .msg-card.video .msg-countdown .cd-num{color:#4ade80;text-shadow:0 0 12px rgba(74,222,128,.35);}
  .msg-card.file .msg-countdown .cd-num{color:#a5b4fc;text-shadow:0 0 12px rgba(129,140,248,.35);}
  .marquee-bar {
    position: fixed;
    left: 0; right: 0; top: 0;
    height: 62px;
    display: none;
    align-items: center;
    overflow: hidden;
    z-index: 300;
    pointer-events: none;
    background: linear-gradient(90deg, #1e293b 0%, #0f172a 100%);
    color: #f1f5f9;
    border-bottom: 2px solid rgba(56,189,248,.45);
    box-shadow: 0 6px 24px rgba(0,0,0,.45);
  }
  .marquee-bar.notice { background: linear-gradient(90deg, #78350f 0%, #451a03 100%); color: #fef9c3; border-bottom-color: rgba(250,204,21,.55); }
  .marquee-bar.urgent { background: linear-gradient(90deg, #7f1d1d 0%, #450a0a 100%); color: #fee2e2; border-bottom-color: rgba(239,68,68,.65); }
  .marquee-content {
    display: inline-block; white-space: nowrap; font-size: 28px; font-weight: 700;
    letter-spacing: 3px; padding-left: 100%; will-change: transform;
    animation: marquee-scroll 20s linear infinite;
  }
  @keyframes marquee-scroll { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }
  .tip{
    position:fixed;bottom:22px;left:0;right:0;text-align:center;
    font-size:12px;color:#334155;letter-spacing:2px;z-index:5;
  }
  @keyframes audioHintPulse {
    0%,100% { transform: translateX(-50%) scale(1); box-shadow: 0 8px 30px rgba(245,158,11,.45); }
    50%     { transform: translateX(-50%) scale(1.06); box-shadow: 0 12px 40px rgba(245,158,11,.75); }
  }
  #audioHint{
    position:fixed; left:50%; bottom:80px; transform:translateX(-50%);
    background:linear-gradient(135deg,#f59e0b 0%,#d97706 100%);
    color:#fff; padding:16px 32px; border-radius:14px;
    font-size:20px; font-weight:700; letter-spacing:3px;
    z-index:9999; cursor:pointer;
    display:flex; align-items:center; gap:10px;
    animation: audioHintPulse 1.8s ease-in-out infinite;
    transition: background .25s, color .25s, box-shadow .25s;
    user-select:none; -webkit-tap-highlight-color:transparent;
    border:2px solid rgba(255,255,255,.35);
  }
  #audioHint .ah-icon{ font-size:22px; animation: audioHintPulse 1.8s ease-in-out infinite; display:inline-flex; }
  #audioHint.ok{ background:linear-gradient(135deg,#16a085 0%,#0e7a63 100%); animation: none; box-shadow: 0 8px 30px rgba(22,160,133,.55); }
  #audioHint.ok .ah-icon{ animation: none; }
  @media (max-width:900px){
    .msg-content{font-size:30px;}
    .msg-card{padding:32px 28px 26px;border-radius:22px;}
    #popup{padding:30px;}
    .idle h1{font-size:22px;letter-spacing:8px;}
    .hud{padding:14px 18px;}
    .hud .room{font-size:15px;}
    .clock{font-size:15px;}
    .msg-image img{max-height:52vh;}
    .msg-image video{max-height:52vh;}
    .msg-file-icon{font-size:60px;}
    .msg-file-name{font-size:20px;}
    .marquee-bar { height: 48px; }
    .marquee-content { font-size: 20px; letter-spacing: 2px; }
    #audioHint{ font-size:16px; padding:12px 22px; letter-spacing:2px; bottom:60px; }
  }
</style>
</head>
<body>
<div class="bg-grid"></div>

<div class="hud">
  <div class="room" id="roomName">教室大屏</div>
  <div class="hud-right">
    <div class="status">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">连接中…</span>
    </div>
    <div class="clock" id="clock">--</div>
  </div>
</div>

<div class="idle" id="idle">
  <div class="icon"><svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg></div>
  <h1>教室大屏</h1>
  <p>等待消息…</p>
</div>

<div id="popup">
  <div class="msg-card text" id="msgCard"></div>
</div>

<div class="marquee-bar" id="marqueeBar" style="display:none;">
  <div class="marquee-content" id="marqueeContent"></div>
</div>

<div class="tip">本页面请常驻运行 · 建议全屏（F11）· 点击屏幕任意位置可关闭弹屏</div>

<div id="audioHint"><span class="ah-icon" id="audioHintIcon"></span>点击此处开启语音播报</div>

<script>
(function () {
  'use strict';

  console.log('[shout-display] loaded @', new Date().toISOString(), 'BUILD=repeat-card-marquee-v5-dingfix');

  var ONLINE_TTS_URL = '/api/tts';
  var ONLINE_TTS_VOICE = 'zh-CN-XiaochenNeural';
  var ONLINE_TTS_TIMEOUT = 700;
  var onlineTTSAvailable = true;

  /* ---- SVG 图标库（Lucide 风格，跟随 currentColor）---- */
  var ICONS = {
    volume:   '<path d="M11 4.07 6 7H2v10h4l5 2.93a1 1 0 0 0 1-.85V4.92a1 1 0 0 0-1-.85z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>',
    check:    '<polyline points="20 6 9 17 4 12"/>',
    megaphone:'<path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/>',
    message:  '<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>',
    image:    '<rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>',
    film:     '<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 3v18"/><path d="M3 7.5h4"/><path d="M3 12h18"/><path d="M3 16.5h4"/><path d="M17 3v18"/><path d="M17 7.5h4"/><path d="M17 16.5h4"/>',
    file:     '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/>',
    folder:   '<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>',
    siren:    '<path d="M7 18v-6a5 5 0 0 1 10 0v6"/><path d="M5 21h14a1 1 0 0 0 1-1v-2H4v2a1 1 0 0 0 1 1z"/><path d="M12 2v2"/><path d="M4 8h2"/><path d="M18 8h2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 6.07 1.41-1.41"/>',
    download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/>',
    warn:     '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" x2="12" y1="9" y2="13"/><line x1="12" x2="12.01" y1="17" y2="17"/>'
  };
  function icon(name, cls) {
    var body = ICONS[name];
    if (!body) return '';
    return '<svg class="svg-icon' + (cls ? ' ' + cls : '') + '" viewBox="0 0 24 24" fill="none" ' +
           'stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
           body + '</svg>';
  }

  var TTS_CFG_TTL_MS = 30 * 1000;
  var _ttsCfgLastFetch = 0;
  var _ttsCfgFetching = null;

  async function refreshTTSConfig(force) {
    var now = Date.now();
    if (!force && now - _ttsCfgLastFetch < TTS_CFG_TTL_MS) return;
    if (_ttsCfgFetching) return _ttsCfgFetching;

    _ttsCfgFetching = (async function () {
      try {
        var r = await fetch('/api/config', { cache: 'no-store' });
        var cfg = await r.json();
        if (cfg && cfg.tts_voice && cfg.tts_voice !== ONLINE_TTS_VOICE) {
          console.log('[shout-display] voice 已更新:',
            ONLINE_TTS_VOICE, '→', cfg.tts_voice);
          ONLINE_TTS_VOICE = cfg.tts_voice;
        }
        _ttsCfgLastFetch = Date.now();
      } catch (e) {
      } finally {
        _ttsCfgFetching = null;
      }
    })();

    return _ttsCfgFetching;
  }

  refreshTTSConfig(true);
  setInterval(function () { refreshTTSConfig(true); }, TTS_CFG_TTL_MS);

  var params = new URLSearchParams(location.search);
  var token  = params.get('token') || '';

  var SINCE_KEY = 'shout_since_' + token;
  var since = 0;
  var isFirstConnect = true;

  var storageOK = (function () {
    try {
      localStorage.setItem('__shout_probe__', '1');
      localStorage.removeItem('__shout_probe__');
      return true;
    } catch (e) { return false; }
  })();

  if (storageOK) {
    try {
      var saved = localStorage.getItem(SINCE_KEY);
      if (saved !== null) {
        since = parseInt(saved, 10) || 0;
        isFirstConnect = false;
      }
    } catch (e) {}
  }

  function saveSince() {
    if (!storageOK) return;
    try { localStorage.setItem(SINCE_KEY, String(since)); } catch (e) {}
  }

  function isExpired(m) {
    var t = new Date(m.created_at).getTime();
    if (isNaN(t)) return false;
    var dur = (m.duration && m.duration > 0 ? m.duration : 20) * 1000;
    var cnt = (m.count && m.count > 0 ? Math.min(3, m.count) : 1);
    return Date.now() - t > dur * cnt + 3000;
  }

  function sleep(ms) {
    return new Promise(function (r) { setTimeout(r, ms); });
  }

  var failCount = 0;
  var popTimer = null;
  var cdTimer = null;
  var queue = [];
  var showing = false;
  var marqueeTimer = null;
  var currentAudio = null;
  var currentAudioFinish = null;

  // 每轮卡片 / 跑马灯的 resolve 句柄
  var currentCardResolve = null;
  var currentMarqueeResolve = null;

  // 用于"结束语音播放"的会话号
  var voiceSessionId = 0;

  // 用于"整个消息处理循环"的会话号
  var messageSessionId = 0;

  var statusDot  = document.getElementById('statusDot');
  var statusText = document.getElementById('statusText');
  var roomNameEl = document.getElementById('roomName');
  var popup      = document.getElementById('popup');
  var msgCard    = document.getElementById('msgCard');
  var audioHintEl = document.getElementById('audioHint');
  var audioHintIconEl = document.getElementById('audioHintIcon');
  if (audioHintIconEl) audioHintIconEl.innerHTML = icon('volume');

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }

  function setOnline(on) {
    statusDot.classList.toggle('on', on);
    statusText.textContent = on ? '在线' : '离线';
  }

  var audioUnlocked = false;

  function hideAudioHint() {
    if (!audioHintEl) return;
    audioHintEl.classList.add('ok');
    audioHintEl.innerHTML = '<span class="ah-icon">' + icon('check') + '</span>语音已开启';
    setTimeout(function () {
      if (audioHintEl) audioHintEl.style.display = 'none';
    }, 1500);
  }

  function unlockAudio() {
    if (audioUnlocked) return;
    if ('speechSynthesis' in window) {
      try {
        var synth = window.speechSynthesis;
        var u = new SpeechSynthesisUtterance(' ');
        u.volume = 0;
        u.lang = 'zh-CN';
        synth.speak(u);
        synth.cancel();
        synth.getVoices();
      } catch (e) {}
    }
    // 预创建 / 恢复 AudioContext，确保后续合成提示音可用
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) {
        if (!dingCtx) dingCtx = new AC();
        if (dingCtx.state === 'suspended') dingCtx.resume();
      }
    } catch (e) {}
    audioUnlocked = true;
    console.log('[shout] ✅ 音频已解锁');
    hideAudioHint();
  }

  ['click', 'touchstart', 'pointerdown', 'keydown'].forEach(function (evt) {
    document.addEventListener(evt, unlockAudio, { capture: true });
  });

  if (audioHintEl) {
    audioHintEl.addEventListener('click', function (e) {
      e.stopPropagation();
      unlockAudio();
    });
  }

  if ('speechSynthesis' in window) {
    try {
      window.speechSynthesis.onvoiceschanged = function () {
        var list = window.speechSynthesis.getVoices() || [];
        console.log('[shout] 浏览器内置 voices loaded:', list.length);
      };
    } catch (e) {}
  }

  /* ---------- 提示铃声 ---------- */
  var DING_URL = '/audio/ding.wav';
  var dingAudio = null;
  var dingBroken = false;
  var dingPlaying = false;
  var dingCtx = null;
  var dingDonePromise = null;

  function synthDing() {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!dingCtx) dingCtx = new AC();

      var doPlay = function () {
        var t0 = dingCtx.currentTime;
        var notes = [[1318.5, 0, 0.22], [987.8, 0.16, 0.34]];
        for (var i = 0; i < notes.length; i++) {
          var freq = notes[i][0], at = notes[i][1], dur = notes[i][2];
          var osc = dingCtx.createOscillator();
          var gain = dingCtx.createGain();
          osc.type = 'sine';
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.0001, t0 + at);
          gain.gain.exponentialRampToValueAtTime(0.32, t0 + at + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, t0 + at + dur);
          osc.connect(gain);
          gain.connect(dingCtx.destination);
          osc.start(t0 + at);
          osc.stop(t0 + at + dur + 0.02);
        }
      };

      if (dingCtx.state === 'suspended') {
        dingCtx.resume().then(doPlay).catch(function () {});
      } else {
        doPlay();
      }
    } catch (e) {}
  }

  function startDing() {
    if (!audioUnlocked) return Promise.resolve(false);
    if (dingPlaying) return dingDonePromise || Promise.resolve(false);

    dingPlaying = true;
    dingDonePromise = new Promise(function (resolve) {
      var finished = false;
      var guard = null;
      function finish() {
        if (finished) return;
        finished = true;
        if (guard) { clearTimeout(guard); guard = null; }
        dingPlaying = false;
        resolve(true);
      }
      // 兜底：最多 1.2s 必须结束，防止 onended 不触发导致卡死
      guard = setTimeout(finish, 1200);

      if (dingBroken) { synthDing(); setTimeout(finish, 420); return; }

      try {
        // 关键修复：每次都 new 一个 Audio，避免复用同一实例第二次 play 静默失败
        var a = new Audio(DING_URL);
        a.preload = 'auto';
        a.volume = 0.85;
        dingAudio = a; // 保留全局引用，方便 stopSpeak 暂停

        a.onended = finish;
        a.onerror = function () {
          dingBroken = true;
          console.warn('[shout] ding.wav 加载失败，改用合成提示音');
          synthDing();
          setTimeout(finish, 420);
        };

        var p = a.play();
        if (p && typeof p.catch === 'function') {
          p.catch(function () {
            dingBroken = true;
            synthDing();
            setTimeout(finish, 420);
          });
        }
      } catch (e) {
        dingBroken = true;
        synthDing();
        setTimeout(finish, 420);
      }
    });
    return dingDonePromise;
  }

  function waitDing() {
    return dingDonePromise || Promise.resolve();
  }

  /* ---------- 播放 base64 音频（等播放结束才 resolve） ---------- */
  async function playPrebuiltAudio(dataUrl) {
    if (!dataUrl) return false;
    await waitDing();
    return new Promise(function (resolve) {
      try {
        if (currentAudio) {
          try { currentAudio.pause(); } catch (e) {}
          if (currentAudioFinish) { try { currentAudioFinish(false); } catch (e) {} }
          currentAudio = null;
          currentAudioFinish = null;
        }
        var audio = new Audio(dataUrl);
        currentAudio = audio;

        var done = false;
        function finish(ok) {
          if (done) return;
          done = true;
          if (currentAudio === audio) {
            currentAudio = null;
            currentAudioFinish = null;
          }
          resolve(ok);
        }
        currentAudioFinish = finish;

        audio.onended = function () { finish(true); };
        audio.onerror = function () { finish(false); };

        var p = audio.play();
        if (p && typeof p.then === 'function') {
          p.catch(function () { finish(false); });
        }
      } catch (e) { resolve(false); }
    });
  }

  /* ---------- 浏览器内置 TTS ---------- */
  function pickBestChineseVoice(synth) {
    var voices = [];
    try { voices = synth.getVoices() || []; } catch (e) { return null; }
    if (!voices.length) return null;

    var zhVoices = voices.filter(function (v) {
      return /^zh/i.test(v.lang) || /Chinese|中文|普通话/i.test(v.name);
    });
    if (!zhVoices.length) return voices[0] || null;

    var priority = ['Xiaoxiao','Xiaoyi','Yunxi','Yunyang','Yunjian','Yunxia'];
    for (var p = 0; p < priority.length; p++) {
      for (var i = 0; i < zhVoices.length; i++) {
        if ((zhVoices[i].name || '').indexOf(priority[p]) >= 0) return zhVoices[i];
      }
    }
    for (var j = 0; j < zhVoices.length; j++) {
      if (/Neural|Natural|Online/i.test(zhVoices[j].name || '')) return zhVoices[j];
    }
    for (var k = 0; k < zhVoices.length; k++) {
      if (/^zh[-_]?CN/i.test(zhVoices[k].lang)) return zhVoices[k];
    }
    return zhVoices[0];
  }

  async function fallbackSpeak(text) {
    if (!text) return false;
    if (!('speechSynthesis' in window)) return false;

    await waitDing();

    return new Promise(function (resolve) {
      try {
        var synth = window.speechSynthesis;
        if (synth.paused) synth.resume();
        synth.cancel();

        var u = new SpeechSynthesisUtterance(String(text));
        u.lang = 'zh-CN';
        u.rate = 0.9;
        u.pitch = 1.0;
        u.volume = 1.0;

        var voice = pickBestChineseVoice(synth);
        if (voice) {
          u.voice = voice;
          u.lang = voice.lang || 'zh-CN';
        }

        var done = false;
        function finish(ok) {
          if (done) return;
          done = true;
          clearTimeout(guard);
          resolve(ok);
        }
        var guard = setTimeout(function () {
          finish(true);
        }, Math.max(15000, String(text).length * 500));

        u.onstart = function () {
          console.log('[shout] ▶️ 降级播报（浏览器内置）:', text);
        };
        u.onend = function () {
          console.log('[shout] ⏹️ 降级播报结束');
          finish(true);
        };
        u.onerror = function (e) {
          console.error('[shout] ❌ 降级播报失败:', e.error);
          finish(false);
        };

        synth.speak(u);
      } catch (e) {
        console.error('[shout] fallbackSpeak 异常:', e);
        resolve(false);
      }
    });
  }

  /* ---------- 在线 TTS ---------- */
  var onlineTTSErrCount = 0;

  async function onlineSpeak(text) {
    if (!onlineTTSAvailable) return false;
    if (!text) return false;

    await refreshTTSConfig();

    var controller = new AbortController();
    var timeoutId = setTimeout(function () { controller.abort(); }, ONLINE_TTS_TIMEOUT);
    var t0 = Date.now();

    try {
      console.log('[shout] 📡 请求在线TTS:', ONLINE_TTS_URL, '| voice:', ONLINE_TTS_VOICE);

      var resp = await fetch(ONLINE_TTS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          input: text,
          voice: ONLINE_TTS_VOICE,
          speed: 1.0,
          pitch: '0',
          style: 'general'
        }),
        signal: controller.signal
      });
      clearTimeout(timeoutId);

      var ct = resp.headers.get('content-type') || '';
      console.log('[shout] 📡 响应:', resp.status, ct, (Date.now() - t0) + 'ms');

      if (!resp.ok) {
        var errText = '';
        try { errText = await resp.text(); } catch (e) {}
        console.error('[shout] ❌ 在线TTS HTTP', resp.status, '| body:', errText.slice(0, 300));
        throw new Error('HTTP ' + resp.status);
      }

      if (/application\/json/i.test(ct)) {
        var jtext = '';
        try { jtext = await resp.text(); } catch (e) {}
        console.error('[shout] ❌ 在线TTS 返回了 JSON（不是音频）:', jtext.slice(0, 300));
        throw new Error('返回JSON而非音频');
      }

      var audioBlob = await resp.blob();
      console.log('[shout] 📡 音频大小:', audioBlob.size, 'bytes, type:', audioBlob.type);

      if (!audioBlob || audioBlob.size < 100) {
        throw new Error('音频数据异常 (size=' + (audioBlob ? audioBlob.size : 0) + ')');
      }

      if (currentAudio) {
        try { currentAudio.pause(); } catch (e) {}
        if (currentAudioFinish) { try { currentAudioFinish(false); } catch (e) {} }
        currentAudio = null;
        currentAudioFinish = null;
      }

      var audioUrl = URL.createObjectURL(audioBlob);
      var audio = new Audio(audioUrl);
      currentAudio = audio;

      await waitDing();

      var playOk = await new Promise(function (resolve) {
        var done = false;
        function finish(ok) {
          if (done) return;
          done = true;
          try { URL.revokeObjectURL(audioUrl); } catch (e) {}
          if (currentAudio === audio) {
            currentAudio = null;
            currentAudioFinish = null;
          }
          resolve(ok);
        }
        currentAudioFinish = finish;

        audio.onended = function () {
          console.log('[shout] ⏹️ 在线播报结束');
          finish(true);
        };
        audio.onerror = function (e) {
          console.error('[shout] ❌ audio 元素播放失败:', e);
          finish(false);
        };

        var p = audio.play();
        if (p && typeof p.then === 'function') {
          p.catch(function () { finish(false); });
        }
      });

      if (!playOk) throw new Error('音频播放失败');

      console.log('[shout] ▶️ 在线播报成功:', text);
      onlineTTSErrCount = 0;
      return true;
    } catch (e) {
      clearTimeout(timeoutId);
      onlineTTSErrCount++;
      console.warn('[shout] ⚠️ 在线TTS 第 ' + onlineTTSErrCount + ' 次失败:', e.message || e);

      if (onlineTTSErrCount >= 1) {
        onlineTTSAvailable = false;
        console.warn('[shout] ⚠️ 本会话改用浏览器内置语音');
      }
      return false;
    }
  }

  /* ---------- 语音播放单遍 ---------- */
  async function playOneVoice(text, prebuiltAudio) {
    if (prebuiltAudio) {
      var okPre = await playPrebuiltAudio(prebuiltAudio);
      if (okPre) return true;
      console.warn('[shout] 预置音频播放失败，降级到在线合成');
    }
    if (!text) return false;
    var ok = await onlineSpeak(text);
    if (!ok) await fallbackSpeak(text);
    return true;
  }

  // 播放一遍语音（会占用一个 voiceSessionId，可以被 stopSpeak 打断）
  async function playVoiceOnce(text, prebuiltAudio) {
    var mySession = ++voiceSessionId;
    startDing();
    await playOneVoice(text, prebuiltAudio);
    if (voiceSessionId !== mySession) return false;
    return true;
  }

  // 独立语音广播模式：count 遍连播（每一遍都响铃）
  async function playVoice(text, prebuiltAudio, count) {
    var mySession = ++voiceSessionId;
    count = Math.max(1, Math.min(3, parseInt(count, 10) || 1));

    for (var i = 0; i < count; i++) {
      if (voiceSessionId !== mySession) return false;
      if (i > 0) {
        // 等上一遍铃声响完再开始下一遍，避免被 dingPlaying 拦住
        await waitDing();
        if (voiceSessionId !== mySession) return false;
        await sleep(250);
        if (voiceSessionId !== mySession) return false;
      }
      startDing(); // ✅ 每一遍都响铃
      await playOneVoice(text, prebuiltAudio);
    }
    return true;
  }

  function stopSpeak() {
    voiceSessionId++;

    if (currentAudio) {
      try { currentAudio.pause(); } catch (e) {}
    }
    if (currentAudioFinish) {
      try { currentAudioFinish(false); } catch (e) {}
    }
    currentAudio = null;
    currentAudioFinish = null;

    if (dingAudio) {
      try { dingAudio.pause(); dingAudio.currentTime = 0; } catch (e) {}
    }
    dingPlaying = false;
    dingDonePromise = null;
    try { if ('speechSynthesis' in window) window.speechSynthesis.cancel(); } catch (e) {}
  }

  /* ---------- 抽取 content 信息 ---------- */
  function extractInfo(m) {
    var info = { text: '', voice: false, display: 'card', audio: '', count: 1 };
    if (!m) return info;
    if (m.msg_type === 'file' || m.msg_type === 'image') {
      info.text = String(m.content == null ? '' : m.content);
      return info;
    }
    var raw = String(m.content == null ? '' : m.content);

    raw = raw.replace(/^[\uFEFF\u200B\u200C\u200D\u00A0\s]+/, '');
    raw = raw.replace(/[\uFEFF\u200B\u200C\u200D\u00A0\s]+$/, '');

    if (raw.charAt(0) !== '{') { info.text = raw; return info; }

    function pickCount(v) {
      var n = parseInt(v, 10);
      if (!n || n < 1) return 1;
      if (n > 3) n = 3;
      return n;
    }

    try {
      var p1 = JSON.parse(raw);
      if (p1 && typeof p1.text === 'string') {
        info.text = p1.text;
        info.voice = !!p1.voice;
        info.display = p1.display || 'card';
        info.audio = p1.audio || '';
        info.count = pickCount(p1.count);
        return info;
      }
    } catch (e1) { console.warn('[shout] JSON.parse fail:', e1.message); }

    try {
      var unescaped = raw.replace(/^"|"$/g, '').replace(/\\"/g, '"').replace(/\\\\/g, '\\');
      if (unescaped.charAt(0) === '{') {
        var p2 = JSON.parse(unescaped);
        if (p2 && typeof p2.text === 'string') {
          info.text = p2.text;
          info.voice = !!p2.voice;
          info.display = p2.display || 'card';
          info.audio = p2.audio || '';
          info.count = pickCount(p2.count);
          console.warn('[shout] recovered: double-escaped');
          return info;
        }
      }
    } catch (e2) {}

    var mt = raw.match(/"text"\s*:\s*"((?:[^"\\]|\\.)*)"/);
    if (mt) {
      var val = mt[1];
      try { val = JSON.parse('"' + val + '"'); } catch (e3) {}
      info.text = val;
      var md = raw.match(/"display"\s*:\s*"([^"]*)"/);
      if (md) info.display = md[1];
      var mv = raw.match(/"voice"\s*:\s*(true|false)/);
      if (mv) info.voice = (mv[1] === 'true');
      var ma = raw.match(/"audio"\s*:\s*"((?:[^"\\]|\\.)*)"/);
      if (ma) {
        try { info.audio = JSON.parse('"' + ma[1] + '"'); } catch (e4) { info.audio = ''; }
      }
      var mc = raw.match(/"count"\s*:\s*(\d+)/);
      if (mc) info.count = pickCount(mc[1]);
      console.warn('[shout] recovered: regex');
      return info;
    }

    console.warn('[shout] cannot extract, using raw');
    info.text = raw;
    return info;
  }

  /* ---------- 分流 ---------- */
  function renderMessage(m) {
    if (!m) return;
    var info = extractInfo(m);
    console.log('[shout] 收到消息', {
      id: m.id, msg_type: m.msg_type,
      display: info.display, voice: info.voice,
      count: info.count,
      hasAudio: !!info.audio,
      audioUnlocked: audioUnlocked,
      text: info.text ? info.text.slice(0, 40) : ''
    });

    if (info.display === 'voice') {
      // 独立语音广播模式：语音自己循环 count 遍
      if (!audioUnlocked) {
        console.warn('[shout] ⚠️ 音频未解锁，等待用户点击屏幕');
        if (audioHintEl) {
          audioHintEl.style.display = 'flex';
          audioHintEl.classList.remove('ok');
          audioHintEl.innerHTML = '<span class="ah-icon">' + icon('volume') + '</span>点击此处开启语音播报';
        }
      }
      if (info.audio || info.voice) {
        playVoice(info.text, info.audio, info.count);
      }
      return;
    }

    // 卡片 / 跑马灯：多轮次显示
    startMessageLoop(m, info);
  }

  /* ---------- 卡片 / 跑马灯：多轮次主循环 ---------- */
  function startMessageLoop(m, info) {
    var mySession = ++messageSessionId;
    showing = true;

    var count = Math.max(1, Math.min(3, parseInt(info.count, 10) || 1));
    console.log('[shout] 开始多轮显示，count =', count);

    (async function () {
      for (var i = 0; i < count; i++) {
        if (mySession !== messageSessionId) return;
        if (i > 0) {
          await sleep(400);
          if (mySession !== messageSessionId) return;
        }

        // 每一轮同时启动语音
        var voiceP = null;
        if (info.voice && (info.audio || info.text)) {
          voiceP = playVoiceOnce(info.text, info.audio);
        }

        // 显示这一轮的卡片 / 跑马灯
        var reason;
        if (info.display === 'marquee') {
          reason = await showMarqueeOnce(m, info);
        } else {
          reason = await showCardOnce(m, info);
        }

        if (mySession !== messageSessionId) {
          stopSpeak();
          return;
        }

        // 自动结束 → 等语音播完再下一轮
        // 用户点击关闭 → 立刻进入下一轮（语音已被 stopSpeak 打断）
        if (voiceP) {
          if (reason === 'timeout') {
            try { await voiceP; } catch (e) {}
            if (mySession !== messageSessionId) return;
          }
        }
      }

      // 全部轮次完成
      if (mySession !== messageSessionId) return;
      showing = false;
      if (queue.length > 0) {
        setTimeout(function () {
          if (!showing && queue.length > 0) {
            var next = queue.shift();
            var nextInfo = extractInfo(next);
            if (nextInfo.display === 'voice') {
              renderMessage(next);
            } else {
              startMessageLoop(next, nextInfo);
            }
          }
        }, 260);
      }
    })();
  }

  /* ---------- 单次卡片显示，返回 Promise ---------- */
  function showCardOnce(m, info) {
    return new Promise(function (resolve) {
      var isFile = (m.msg_type === 'file');
      var fileMeta = null;
      if (isFile) { try { fileMeta = JSON.parse(m.content); } catch (e) { fileMeta = null; } }

      var typeLabel = icon('message') + ' 消息';
      if (isFile && fileMeta) {
        var ft = fileMeta.type || '';
        if (/^image\//.test(ft))      typeLabel = icon('image') + ' 图片';
        else if (/^video\//.test(ft)) typeLabel = icon('film') + ' 视频';
        else                          typeLabel = icon('folder') + ' 文件';
      } else if (m.msg_type === 'image') { typeLabel = icon('image') + ' 图片'; }
      else if (m.msg_type === 'urgent')  { typeLabel = icon('siren') + ' 紧急'; }
      else if (m.msg_type === 'notice')  { typeLabel = icon('megaphone') + ' 通知'; }

      var cls = 'msg-card ';
      if (isFile && fileMeta) {
        var ft2 = fileMeta.type || '';
        if (/^image\//.test(ft2))      cls += 'image';
        else if (/^video\//.test(ft2)) cls += 'video';
        else                           cls += 'file';
      } else if (m.msg_type === 'image') { cls += 'image'; }
      else { cls += (m.msg_type || 'text'); }

      var bodyHtml = '';
      var needAutoOpen = false;
      var voiceTagHtml = '';
      var finalTextForVoice = '';

      if (isFile && fileMeta) {
        var ft3 = fileMeta.type || '';
        var autoOpen = !!fileMeta.open;
        if (/^image\//.test(ft3)) {
          bodyHtml = '<div class="msg-image"><img src="' + fileMeta.data + '" alt="图片" /></div>';
        } else if (/^video\//.test(ft3)) {
          bodyHtml = '<div class="msg-image"><video id="msgVideoEl" src="' + fileMeta.data + '" ' +
            (autoOpen ? 'autoplay ' : '') + 'controls playsinline preload="auto"></video></div>';
          if (autoOpen) {
            setTimeout(function () {
              var v = document.getElementById('msgVideoEl');
              if (v && v.paused) {
                var hint = document.createElement('div');
                hint.style.cssText = 'text-align:center;color:#94a3b8;font-size:13px;margin-top:10px;letter-spacing:2px;';
                hint.textContent = '（如未自动播放，请点击视频播放按钮）';
                v.parentNode.appendChild(hint);
              }
            }, 1200);
          }
        } else {
          bodyHtml = '<div class="msg-file">' +
              '<div class="msg-file-icon">' + icon('file') + '</div>' +
              '<div class="msg-file-name">' + esc(fileMeta.name || '文件') + '</div>' +
              '<div class="msg-file-hint">' + (autoOpen ? '正在打开…' : '点击下方按钮在一体机打开') + '</div>' +
              '<a class="msg-file-btn" id="msgFileOpenBtn" download="' + esc(fileMeta.name || 'file') + '" href="' + fileMeta.data + '">' + icon('download') + ' 打开 / 下载</a>' +
            '</div>';
          needAutoOpen = autoOpen;
        }
      } else if (m.msg_type === 'image') {
        bodyHtml = '<div class="msg-image"><img src="' + m.content + '" alt="图片" /></div>';
      } else {
        var finalText = info.text || '';
        if (finalText.charAt(0) === '{' && finalText.indexOf('"text"') >= 0) {
          try {
            var pj = JSON.parse(finalText);
            if (pj && typeof pj.text === 'string') finalText = pj.text;
          } catch (e4) {
            var mj = finalText.match(/"text"\s*:\s*"((?:[^"\\]|\\.)*)"/);
            if (mj) { try { finalText = JSON.parse('"' + mj[1] + '"'); } catch (e5) { finalText = mj[1]; } }
          }
        }
        bodyHtml = '<div class="msg-content">' + esc(finalText) + '</div>';
        if (info.voice) {
          voiceTagHtml = '<span class="msg-voice-tag">' + icon('volume') + ' 语音播报中</span>';
        }
        finalTextForVoice = finalText;
      }

      var totalSec = (m.duration && m.duration > 0) ? m.duration : 20;

      msgCard.className = cls;
      msgCard.innerHTML =
        '<div class="msg-head">' +
          '<span class="msg-type">' + typeLabel + '</span>' +
          '<span class="msg-from">' + esc(m.sender_name) + ' · ' + esc(m.sender_role) + voiceTagHtml + '</span>' +
        '</div>' + bodyHtml +
        '<div class="msg-foot">' + new Date(m.created_at).toLocaleTimeString('zh-CN') + '</div>' +
        '<div class="msg-countdown">' +
          '<span>本消息将在</span>' +
          '<span class="cd-num" id="msgCountdownNum">' + totalSec + '</span>' +
          '<span>秒后自动关闭</span>' +
        '</div>';

      popup.classList.add('show');

      if (needAutoOpen) {
        setTimeout(function () {
          var a = document.getElementById('msgFileOpenBtn');
          if (a) a.click();
        }, 150);
      }

      if (popTimer) clearTimeout(popTimer);
      popTimer = setTimeout(function () {
        if (currentCardResolve) currentCardResolve('timeout');
      }, totalSec * 1000);

      if (cdTimer) clearInterval(cdTimer);
      var remain = totalSec;
      var numEl = document.getElementById('msgCountdownNum');
      cdTimer = setInterval(function () {
        remain -= 1;
        if (remain < 0) remain = 0;
        if (numEl) numEl.textContent = remain;
        if (remain <= 0) { clearInterval(cdTimer); cdTimer = null; }
      }, 1000);

      currentCardResolve = function (reason) {
        if (popTimer) { clearTimeout(popTimer); popTimer = null; }
        if (cdTimer) { clearInterval(cdTimer); cdTimer = null; }
        try {
          var v = document.getElementById('msgVideoEl');
          if (v) { v.pause(); v.currentTime = 0; }
        } catch (e) {}
        popup.classList.remove('show');
        currentCardResolve = null;
        resolve(reason);
      };
    });
  }

  /* ---------- 单次跑马灯显示，返回 Promise ---------- */
  function showMarqueeOnce(m, info) {
    return new Promise(function (resolve) {
      var bar = document.getElementById('marqueeBar');
      if (!bar) {
        bar = document.createElement('div');
        bar.id = 'marqueeBar';
        bar.className = 'marquee-bar';
        bar.innerHTML = '<div class="marquee-content" id="marqueeContent"></div>';
        document.body.appendChild(bar);
      }
      var contentEl = document.getElementById('marqueeContent');
      if (!contentEl) { resolve('timeout'); return; }

      var text = info.text || '';
      if (!text) { resolve('timeout'); return; }

      var typeCls = 'text'; var prefix = icon('message') + ' ';
      if (m.msg_type === 'urgent')      { typeCls = 'urgent'; prefix = icon('siren') + ' '; }
      else if (m.msg_type === 'notice') { typeCls = 'notice'; prefix = icon('megaphone') + ' '; }
      bar.className = 'marquee-bar ' + typeCls;

      var sender = m.sender_name ? m.sender_name + '：' : '';
      var displayHtml = prefix + esc(sender) + esc(text);
      contentEl.innerHTML = displayHtml;

      var scrollSec = Math.max(10, Math.min(40, (sender + text).length * 0.5 + 10));
      contentEl.style.animation = 'none';
      void contentEl.offsetWidth;
      contentEl.style.animation = 'marquee-scroll ' + scrollSec + 's linear infinite';
      bar.style.display = 'flex';

      var durSec = (m.duration && m.duration > 0) ? m.duration : 20;

      if (marqueeTimer) clearTimeout(marqueeTimer);
      marqueeTimer = setTimeout(function () {
        bar.style.display = 'none';
        contentEl.style.animation = 'none';
        marqueeTimer = null;
        if (currentMarqueeResolve) {
          currentMarqueeResolve = null;
          resolve('timeout');
        }
      }, durSec * 1000);

      currentMarqueeResolve = function () {
        if (marqueeTimer) { clearTimeout(marqueeTimer); marqueeTimer = null; }
        bar.style.display = 'none';
        contentEl.style.animation = 'none';
        currentMarqueeResolve = null;
        resolve('cancel');
      };
    });
  }

  /* ---------- 队列 & 入口 ---------- */
  function enqueueMessage(m) {
    var info = extractInfo(m);
    if (info.display === 'voice') {
      renderMessage(m); return;
    }
    if (showing) { queue.push(m); } else { renderMessage(m); }
  }

  /* ---------- 用户点击关闭 ---------- */
  popup.addEventListener('click', function () {
    if (!currentCardResolve) return;
    // 用户点击 → 停止语音 → 结束当前轮
    stopSpeak();
    currentCardResolve('user');
  });

  /* ---------- 轮询 ---------- */
  async function poll() {
    if (!token) return;
    try {
      var resp = await fetch('/api/shout/feed?token=' +
        encodeURIComponent(token) + '&since=' + since, { cache: 'no-store' });
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      var data = await resp.json();
      setOnline(true);
      failCount = 0;
      if (data.room && data.room.name) roomNameEl.textContent = data.room.name;

      var list = data.messages || [];
      var maxId = since;
      for (var i = 0; i < list.length; i++) {
        if (list[i].id > maxId) maxId = list[i].id;
      }

      if (isFirstConnect) {
        since = maxId; saveSince(); isFirstConnect = false; return;
      }

      for (var j = 0; j < list.length; j++) {
        var msg = list[j];
        if (isExpired(msg)) continue;
        enqueueMessage(msg);
      }

      if (maxId > since) { since = maxId; saveSince(); }
    } catch (e) {
      failCount++;
      if (failCount >= 2) setOnline(false);
    }
  }

  function tick() {
    var d = new Date();
    var p = function (n) { return String(n).padStart(2, '0'); };
    document.getElementById('clock').textContent =
      d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) +
      '  ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }

  if (!token) {
    document.body.innerHTML =
      '<div style="text-align:center;color:#94a3b8;font-size:20px;line-height:2;padding:40px;">' +
        icon('warn') + ' 缺少 token 参数<br>' +
        '<span style="font-size:14px;color:#64748b;">请在「班级 → 喊话」中打开教室详情，复制「大屏地址」后重新打开</span>' +
      '</div>';
    return;
  }

  tick();
  setInterval(tick, 1000);
  poll();
  setInterval(poll, 2000);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) poll();
  });
})();
</script>
