version: "3.8"

services:
  kebiao:
    build: .
    container_name: kebiao
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - JWT_SECRET=change-me-in-production
      - DATA_DIR=/app/data
    volumes:
      - kebiao_data:/app/data
    restart: unless-stopped

volumes:
  kebiao_data:
